# See the documentation for more information:
# https://packit.dev/docs/configuration/

upstream_project_url: https://gitlab.gnome.org/GNOME/NetworkManager-openvpn

issue_repository: https://gitlab.gnome.org/GNOME/NetworkManager-openvpn/-/issues

jobs:
- job: pull_from_upstream
  trigger: release
  dist_git_branches:
    - fedora-all

- job: koji_build
  trigger: commit
  dist_git_branches:
    - fedora-all

- job: bodhi_update
  trigger: commit
  dist_git_branches:
    - fedora-branched
